[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-copilot"
version = "0.1.0"
description = "Domain-specialised RAG assistant for job search, CV tailoring and interview practice"
requires-python = ">=3.12"
readme = "README.md"

# One dependency list, here, rather than a requirements.txt and a
# requirements-dev.txt that repeat it. `pip install -e ".[dev]"` gets
# everything; `pip install .` gets what the application needs to run.
dependencies = [
    # ---- models and orchestration ----
    "openai>=1.40,<2",
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langsmith>=0.1.100",
    # ---- configuration and validation ----
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0",
    "tenacity>=8.3,<10",
    # ---- retrieval ----
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    # ---- storage and documents ----
    "sqlalchemy>=2.0",
    "python-docx>=1.1",
    # ---- HTTP: serves the API and the built React bundle from one process ----
    "httpx>=0.27",
    "fastapi>=0.115,<1",
    # [standard] brings uvloop and httptools; the SSE stream is long-lived and
    # benefits from both, and neither changes the code.
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    # scripts/generate_art.py post-processes what the image model returns.
    # Both arrive transitively today; naming them here means the script does
    # not break the day a transitive dependency drops one.
    "pillow>=10.0",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["career_copilot*"]

[tool.setuptools.package-data]
career_copilot = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE", "TRY"]
ignore = [
    "TRY003",  # long messages outside exception classes - we do this deliberately
    "E501",    # line length is the formatter's job, not the linter's
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001", "TRY", "N802"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "career_copilot.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["scripts.*", "tests.*", "faster_whisper.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not live"` is the important one. The live suite makes real, paid calls
# to OpenRouter, and the marker was documented as "deselected in CI" without
# anything actually deselecting it - so an ordinary `pytest` spent money on
# every run. A `-m` given on the command line replaces this one, so
# `pytest -m live` still runs exactly that suite.
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: hits a real external API and spends money - run deliberately with: pytest -m live",
    "slow: takes more than a second",
]

[tool.coverage.run]
source = ["career_copilot"]
omit = ["*/__init__.py"]

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

